# Render blueprint for the API (free plan). The web app runs on Vercel and the slicer
# (geometry service) on a Hugging Face Space; see docs/DEPLOYMENT.md.
services:
  - type: web
    name: print-os-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://3d-print-os.vercel.app
      - key: DB_REQUIRED_ON_BOOT
        value: 'false'
      # Generated by Render; rotating them signs everyone out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Entered in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEOMETRY_SERVICE_URL
        sync: false
      - key: GEOMETRY_SERVICE_KEY
        sync: false
