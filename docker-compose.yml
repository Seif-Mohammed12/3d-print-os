services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printos
      POSTGRES_PASSWORD: printos
      POSTGRES_DB: printos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U printos -d printos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://printos:printos@postgres:5432/printos
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://printos:printos@postgres:5432/printos
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
